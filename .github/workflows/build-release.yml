name: Build and Release Knowledge DB

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      retake_baseline:
        description: 'Accept current retrieval as the new baseline instead of checking against the old one'
        type: boolean
        default: false
      baseline_reason:
        description: 'Why the corpus moved. Recorded in the baseline; required when retaking.'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/mcp_server/chunker.rb'
      - 'src/mcp_server/embeddings.rb'

concurrency:
  group: build-release-knowledge-db
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Shallow clone source repos
        run: |
          mkdir -p sources
          repos=(
            "musa-dsl"
            "musadsl-demo"
            "midi-events"
            "midi-parser"
            "midi-communications"
            "midi-communications-macos"
            "midi-communications-windows"
            "musalce-server"
          )
          for repo in "${repos[@]}"; do
            git clone --depth 1 "https://github.com/javier-sy/${repo}.git" "sources/${repo}" || true
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Generate chunks
        run: |
          bundle exec ruby src/mcp_server/indexer.rb \
            --source-root sources \
            --chunks-dir src/data/chunks \
            --chunks-only

      - name: Embed and build knowledge DB
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          bundle exec ruby src/mcp_server/indexer.rb \
            --source-root sources \
            --chunks-dir src/data/chunks \
            --db-path src/mcp_server/knowledge.db \
            --embed

      # The index is built; now find out whether it can be searched. A database
      # that is well formed and answers the wrong document is indistinguishable
      # from a good one until somebody asks it something, so ask it here rather
      # than after it is released. The chunker already refuses to produce an
      # empty kind; this refuses to publish an index that cannot route.
      - name: Check the document contract with musa-dsl
        env:
          NOTA_MUSA_DSL_PATH: sources/musa-dsl
        run: bundle exec ruby tools/contract-check.rb

      # The battery refuses to publish an index that answers worse than the one
      # before it, and it deliberately will not decide whether a drop is a
      # regression or a corpus that legitimately moved. When it is the second --
      # documents added, a section renamed -- the baseline is retaken, and that
      # is an explicit act with a reason attached, not a default.
      - name: Retrieval battery
        if: ${{ !inputs.retake_baseline }}
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          KNOWLEDGE_DB_PATH: src/mcp_server/knowledge.db
        run: bundle exec ruby tools/retrieval-battery.rb

      - name: Retrieval battery, taking a new baseline
        if: ${{ inputs.retake_baseline }}
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          KNOWLEDGE_DB_PATH: src/mcp_server/knowledge.db
          REASON: ${{ inputs.baseline_reason }}
        run: |
          if [ -z "$REASON" ]; then
            echo "::error::retake_baseline needs baseline_reason: say what moved in the corpus."
            exit 1
          fi
          bundle exec ruby tools/retrieval-battery.rb --baseline "$REASON"

      # Taken here rather than on a laptop so that the numbers come from the
      # same machine, Ruby and embedding model that will later be checked
      # against them. tools/ is in neither workflow's paths filter, so this
      # commit triggers nothing.
      - name: Commit the new baseline
        if: ${{ inputs.retake_baseline }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tools/retrieval-baseline.json
          git diff --staged --quiet && echo "Baseline unchanged." && exit 0
          git commit -m "Retrieval baseline: ${{ inputs.baseline_reason }}"
          git push

      - name: Package knowledge DB
        run: gzip -c src/mcp_server/knowledge.db > knowledge.db.gz

      - name: Get current date for tag
        id: date
        run: echo "date=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "db-${{ steps.date.outputs.date }}"
          name: "Knowledge DB ${{ steps.date.outputs.date }}"
          body: |
            Automated knowledge DB build from source repositories.

            Triggered by: ${{ github.event_name }}
          files: knowledge.db.gz
          make_latest: true
